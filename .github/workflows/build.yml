name: Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 🚀 JollyRP ${{ github.ref_name }}

            > **No installer needed.** JollyRP now runs directly from source in your browser.

            ### Quick Start

            ```bash
            git clone https://github.com/zdron7612-star/ImagiC-JollyRP.git
            cd ImagiC-JollyRP
            ```

            **Linux / macOS:**
            ```bash
            chmod +x setup.sh start.sh
            ./setup.sh   # Run once
            ./start.sh   # Run every time
            ```

            **Windows:**
            ```
            Setup.bat    ← Run once
            Start.bat    ← Run every time
            ```

            Then open your browser at **http://localhost:3001**

            ---
            See the [README](https://github.com/zdron7612-star/ImagiC-JollyRP#readme) for full setup instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
